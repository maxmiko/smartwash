<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2767dd">
<meta name="robots" content="noindex, follow">
<title>404 — lapa nav atrasta · Smart Wash</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Manrope';font-weight:400 800;font-display:swap;src:url('assets/fonts/manrope-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0152-0153,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Manrope';font-weight:400 800;font-display:swap;src:url('assets/fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#13202e;
  background:linear-gradient(180deg,#fff 0%,#eaf2fb 100%)}
.drop{width:64px;height:64px;border-radius:50% 50% 50% 6px;margin:0 auto 24px;
  background:linear-gradient(150deg,#4f8df1,#2767dd);transform:rotate(-12deg);box-shadow:0 12px 30px rgba(39,103,221,.3)}
h1{font-size:clamp(64px,12vw,120px);margin:0;letter-spacing:-.04em;color:#2767dd;line-height:1}
p.t{font-size:22px;font-weight:700;margin:8px 0 6px}
p.s{color:#51606f;margin:0 0 28px;max-width:42ch}
a.btn{display:inline-flex;align-items:center;gap:9px;background:#2767dd;color:#fff;font-weight:700;
  padding:14px 26px;border-radius:999px;text-decoration:none;transition:transform .2s,background .2s}
a.btn:hover{background:#1d51b6;transform:translateY(-2px)}
.langs{margin-top:22px;font-size:14px;color:#51606f}
.langs a{color:#2767dd;text-decoration:none;font-weight:700;margin:0 6px}
</style>
</head>
<body>
  <main>
    <div class="drop" aria-hidden="true"></div>
    <h1>404</h1>
    <p class="t">Lapa nav atrasta</p>
    <p class="s">Šķiet, šī lapa ir aizskalota. Atgriezies sākumlapā un turpini ceļu.</p>
    <a class="btn" href="./">← Uz sākumlapu</a>
    <div class="langs">
      <a href="./">LV</a> · <a href="ru/">RU</a> · <a href="en/">EN</a>
    </div>
  </main>
</body>
</html>
